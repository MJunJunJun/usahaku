# ============================================================
# GoWA — WhatsApp Web Multidevice Gateway (aldinokemal/go-whatsapp-web-multidevice)
# Jalankan:  docker compose -f docker-compose.gowa.yml --env-file backend/.env up -d
# QR pertama kali: buka Panel Admin > WhatsApp > tombol "Tampilkan QR"
# ============================================================

services:
  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: usahaku-gowa
    restart: unless-stopped
    ports:
      # GoWA di host port 3001 agar TIDAK bentrok dengan frontend React (3000)
      - "3001:3000"
    volumes:
      # Sesi WhatsApp disimpan di sini agar TIDAK perlu scan QR ulang saat restart
      - ./gowa-data:/app/storages
    environment:
      - GOWA_BASE_URL=${GOWA_BASE_URL:-http://localhost:3000}
    command:
      - "rest"
      - "--basic-auth=${GOWA_USER}:${GOWA_PASS}"
      - "--webhook=${GOWA_WEBHOOK_URL}"
      - "--os=UsahaKu"
      - "--account-validation=false"
      - "--autoreply=false"
      - "--webhook-secret=${WHATSAPP_WEBHOOK_SECRET}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
