services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    environment:
      MONGO_URL: ${MONGO_URL}
      DB_NAME: usahaku
      JWT_SECRET: ${JWT_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@usahaku.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_NAME: Situska
      SUPPORT_EMAIL: hello@usahaku.id
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.situska.com}
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "true"
      CORS_ORIGIN_REGEX: ^https?://(.*\.)?situska\.com$
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      REQUIRE_DISTRIBUTED_RATE_LIMIT: "true"
      REQUIRE_ADMIN_MFA: "true"
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET}
      GOWA_BASE_URL: http://usahaku-gowa:3000
      GOWA_USER: admin
      GOWA_PASS: ${GOWA_PASS}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.runtime:/app/.runtime

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
        REACT_APP_BRAND_NAME: Situska
        REACT_APP_PUBLIC_SITE_HOST: situska.com
        REACT_APP_TURNSTILE_SITE_KEY: ${REACT_APP_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: ""
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      # Nginx virtual host is mounted from the repo so HTML routing and SEO
      # changes apply without rebuilding the React image.
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: usahaku-gowa
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    volumes:
      - ./gowa-data:/app/storages
    command:
      - "rest"
      - "--basic-auth=${GOWA_USER}:${GOWA_PASS}"
      - "--webhook=http://backend:8000/api/wa/webhook"
      - "--os=Situska"
      - "--account-validation=false"
      - "--autoreply=false"
      - "--ui-enabled=false"
      - "--mcp-enabled=false"
      - "--webhook-secret=${WHATSAPP_WEBHOOK_SECRET}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
