services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: usahaku
      # Kosong berarti backend membuat secret lokal di volume .runtime.
      # Di production sebaiknya isi JWT_SECRET dari environment server.
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@usahaku.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      APP_NAME: ${APP_NAME:-Situska}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-hello@buildza.id}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOWA_BASE_URL: http://gowa:3000
      GOWA_USER: admin
      GOWA_PASS: admin123
      WHATSAPP_WEBHOOK_SECRET: usahaku_wa_secret_2026
    ports:
      - 8000:8000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.runtime:/app/.runtime

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
        REACT_APP_BRAND_NAME: ${APP_NAME:-Situska}
        REACT_APP_PUBLIC_SITE_HOST: ${PUBLIC_SITE_HOST:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: ""
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: usahaku-gowa
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    volumes:
      - ./gowa-data:/app/storages
    command:
      - "rest"
      - "--basic-auth=admin:admin123"
      - "--webhook=http://backend:8000/api/wa/webhook?secret=usahaku_wa_secret_2026"
      - "--os=Situska"
      - "--account-validation=false"
      - "--autoreply=false"
      - "--webhook-secret=usahaku_wa_secret_2026"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
