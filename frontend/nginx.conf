server {
    listen 3000;
    # Menjadi default virtual host sehingga image yang sama bisa dipakai pada
    # localhost, domain produksi, maupun domain baru tanpa rebuild.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ask the API only for legacy article slugs. A matched historical URL gets
    # a genuine 301; normal/current article paths fall back to the React SPA.
    location ~ ^/artikel/[^/]+$ {
        proxy_pass http://backend:8000;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
