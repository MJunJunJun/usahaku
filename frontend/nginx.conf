server {
    listen 3000;
    client_max_body_size 8m;
    # Menjadi default virtual host sehingga image yang sama bisa dipakai pada
    # localhost, domain produksi, maupun domain baru tanpa rebuild.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline browser hardening. TLS and HSTS are configured at the external
    # reverse proxy/CDN that terminates HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'" always;

    # robots.txt advertises the standard root sitemap URL.  Route it to the
    # API explicitly instead of letting the SPA fallback return index.html.
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not preserve a client-supplied X-Forwarded-For value: the API
        # uses this address as part of abuse/rate-limit controls.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ask the API only for legacy article slugs. A matched historical URL gets
    # a genuine 301; normal/current article paths fall back to the React SPA.
    location ~ ^/artikel/[^/]+$ {
        proxy_pass http://backend:8000;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
